<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keranjang — Katalog Produk Warung</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="wadah">
    <p><a class="tautan-kembali" href="/">← Kembali ke katalog</a></p>

    <h1>Keranjang Belanja</h1>

    <div class="kartu">
      <p id="pesan" class="pesan"></p>
      <div id="daftar-keranjang"></div>
      <p id="keranjang-kosong" class="keterangan" hidden>Keranjang masih kosong. Balik ke katalog, lalu ketuk produk yang mau dibeli.</p>
      <div id="ringkasan-keranjang" hidden>
        <p class="total">Total: <span id="total-harga"></span></p>
        <button id="kosongkan-keranjang" type="button" class="tombol-kosongkan">Kosongkan keranjang</button>
        <p class="keterangan">Pesan via WhatsApp menyusul di tahap berikutnya.</p>
      </div>
    </div>
  </div>

  <script src="/js/keranjang.js"></script>
</body>
</html>
