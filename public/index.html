<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog Produk Warung</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="wadah">
    <p class="bar-atas"><a class="tautan-keranjang" href="/keranjang.html">Keranjang<span data-lencana-keranjang></span></a></p>
    <h1>Katalog Produk Warung</h1>
    <p class="keterangan">Lihat barang yang tersedia hari ini, lalu pesan lewat WhatsApp. Harga sudah termasuk, stok diperbarui dari warung.</p>

    <div class="kartu">
      <input class="pencarian" id="cari" type="search" placeholder="Cari produk, misal kopi..." autocomplete="off">
      <div class="saringan" id="saringan">
        <button class="tombol-saring aktif" data-kategori="">Semua</button>
      </div>
      <p id="pesan" class="pesan"></p>
      <div class="grid-produk" id="daftar-produk"></div>
      <p id="kosong" class="keterangan" hidden>Belum ada produk dalam kategori ini.</p>
    </div>

    <p class="keterangan">Pemesanan via WhatsApp menyusul di tahap berikutnya.</p>
  </div>

  <script src="/js/keranjang.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
